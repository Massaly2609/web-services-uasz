spring.application.name=GRPC

# Pas de serveur web Spring : c'est Armeria qui écoute (voir GrpcServerConfig)
spring.main.web-application-type=none
spring.main.keep-alive=true

# Port du serveur gRPC / gRPC-Web
grpc.server.port=9090

# 3 personnes d'exemple au démarrage (false pour démarrer à vide)
app.donnees-demo=true

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:grpc-db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
